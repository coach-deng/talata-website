name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # 2 Oct 2026: a nightly re-render, so an early-bird price flips at its deadline
  # without a push. tools/apply-facts.py reads the committed data/facts.json (CI
  # has no vault) and works out today's price; nothing is committed.
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fill times and prices from data/facts.json
        run: python3 tools/apply-facts.py

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name talata-website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
